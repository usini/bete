[package]
name = "bete-android-proto"
version = "0.1.0"
edition = "2021"
[lib]
name = "bete_android_proto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

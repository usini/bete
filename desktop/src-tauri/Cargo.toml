[package]
name = "bete-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_System_DataExchange", "Win32_System_Registry", "Win32_Security", "Win32_UI_Shell", "Win32_Storage_FileSystem", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
base64 = "0.23"
getrandom = "0.3"
keyring = { version = "3.6", features = ["windows-native"] }
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "native-tls-no-alpn"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tiny_http = "0.12"
serde_json = "1"

png = "0.18"
